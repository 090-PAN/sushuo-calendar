name: publish-activity-calendar
on:
  schedule:
    # 每 2 小时自动同步一次（UTC 偶数小时 → 北京时间 08/10/12/.../次日 06）
    - cron: '0 */2 * * *'
  workflow_dispatch:           # 也支持手动触发（GitHub 网页一键，约 10 秒完成）
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成日历（输出到仓库根，与 Pages「从根目录发布」对应）
        run: python publish_calendar.py --out .
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
          ACTIVITY_ICS_BASE_URL: ${{ secrets.ACTIVITY_ICS_BASE_URL }}
      - name: 提交并推送
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "chore: update activity calendar" || echo "no changes"
          git push
