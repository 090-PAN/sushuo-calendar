name: publish-activity-calendar
on:
  schedule:
    - cron: '0 1 * * *'        # 每天 UTC 01:00 = 北京时间 09:00，自动把新活动同步到订阅日历
  workflow_dispatch:           # 也支持手动触发
permissions:
  contents: write              # 允许工作流把更新后的日历推送回仓库（Pages 自动发布）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成日历（输出到仓库根，与 Pages「从根目录发布」对应）
        run: python publish_calendar.py --out .
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
          ACTIVITY_ICS_BASE_URL: ${{ secrets.ACTIVITY_ICS_BASE_URL }}
      - name: 提交并推送
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "chore: update activity calendar" || echo "no changes"
          git push
