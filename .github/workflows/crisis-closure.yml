name: crisis-closure-watch

# 危机闭环回执 · GitHub Actions 定时任务
# 每 10 分钟扫一次飞书危机记录表，发现「处理状态」变为已跟进/已结案时，向老师群推绿色回执卡。
# 幂等：靠表中「闭环回执」字段，重复运行不会重复推送。
#
# 手动触发：仓库 Actions → 左侧 crisis-closure-watch → 右侧 Run workflow（约 15 秒出结果）
# 演示建议用手动触发，定时器存在 5-20 分钟延迟，不适合现场等待。

on:
  schedule:
    # 每 10 分钟一次（UTC 时间；GitHub 免费额度下已是最密的合理值）
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # 支持手动触发

# 防止多轮重叠
concurrency:
  group: crisis-closure
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run closure watcher
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
        run: |
          python crisis_closure_watch.py --once
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          python crisis_closure_watch.py --once
